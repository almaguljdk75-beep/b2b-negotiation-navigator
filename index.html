.foot{display:flex;justify-content:space-between;padding:13px 18px;border-top:1px solid var(--line)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px}.notice{padding:13px;background:#eef1ff;border:1px solid #dfe4ff;border-radius:11px;color:#697493;font-size:11px;margin-bottom:11px}.notice b{display:block;color:#35436b}.sec{margin-bottom:10px;overflow:hidden}.stitle{font-size:12px;font-weight:bold;padding:11px 14px;border-bottom:1px solid #eff0f4}.stitle small{display:block;color:#939bab;font-weight:400;font-size:9px}.sbody{padding:12px 14px}.editor{min-height:62px;resize:vertical;line-height:1.5}.hyp{background:#fff7e8;border-radius:8px;padding:8px;margin:6px 0}.hyp small{display:block;color:#9a7635;font-weight:bold}.qgroup{padding:8px 0;border-bottom:1px solid #eff0f4}.qgroup h4{margin:0 0 5px;font-size:10px;color:#768196}.qrow{display:grid;grid-template-columns:17px 1fr;gap:6px;padding:4px 0;font-size:10px}.qrow input{accent-color:var(--blue);margin-top:3px}.qrow textarea{grid-column:2;min-height:30px;padding:5px;font-size:10px}.direction,.objection{border:1px solid #edf0f5;border-radius:8px;padding:9px;margin-bottom:7px;font-size:10px}.direction p,.objection p{color:#707b8e;margin:5px 0}.phrase{background:#f4f6ff;border-left:3px solid #8592ef;padding:8px;margin:6px 0;font-size:10px}.agenda{display:grid;grid-template-columns:22px 1fr 22px;gap:6px;align-items:center;margin:5px 0}.agenda input{padding:7px;font-size:10px}.agenda button{border:0;background:none;color:#a66}.aside{position:sticky;top:75px}.mini{padding:12px;background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;font-size:10px}.mini a{display:block;padding:4px;color:#748094}.modalback{position:fixed;inset:0;background:#18233b77;display:grid;place-items:center;z-index:5;padding:15px}.modal{background:white;border-radius:13px;padding:20px;width:min(370px,100%)}.modal p{color:#748094;font-size:12px}.modalfoot{text-align:right}.toast{position:fixed;right:20px;bottom:20px;padding:11px 15px;background:#253149;color:white;border-radius:9px;opacity:0;z-index:7;font-size:11px}.toast.show{opacity:1}.mobile{display:none}
@media(max-width:850px){.content{padding:24px}.top{padding:0 24px}.layout{grid-template-columns:1fr 180px}}@media(max-width:650px){.side{display:none}.main{margin:0;padding-bottom:55px}.top{height:52px;padding:0 13px}.content{padding:20px 12px}.head h1{font-size:21px}.head>.btn{font-size:10px;padding:8px}.stats{gap:6px}.stat{padding:10px}.stat small{font-size:9px}.stat strong{font-size:15px}.cardhead{display:block;padding:13px}.filters{margin-top:9px}.filters input{flex:1;min-width:0}.row{grid-template-columns:1fr auto}.row span:nth-child(2),.row span:nth-child(3){display:none}.grid{grid-template-columns:1fr;padding:14px}.field.full,.subtitle{grid-column:1}.foot{padding:12px;gap:8px;flex-direction:column}.foot .actions{align-self:flex-end}.layout{display:flex;flex-direction:column}.aside{position:static;order:0}.layout>div:first-child{order:1}.aside .mini:first-child{display:none}.mobile{display:flex;position:fixed;inset:auto 0 0;height:54px;background:white;border-top:1px solid var(--line);justify-content:space-around;align-items:center;z-index:4}.mobile button{border:0;background:none;color:#657187;font-size:10px}}@media(max-width:380px){.content{padding-inline:9px}.head h1{font-size:19px}.stats{grid-template-columns:repeat(3,1fr)}}

<body><aside class="side"><div class="brand"><div class="mark">N</div><div>Навигатор переговоров<small>B2B · ЛИЧНЫЙ ИНСТРУМЕНТ</small></div></div><button class="nav active" data-go="home">⌂　Мои подготовки</button><button class="nav" data-go="form">＋　Новая подготовка</button><div class="spacer"></div><div class="privacy"><b>🔒 Данные остаются у вас</b>Сохраняются в этом браузере. Никакие данные не отправляются.</div></aside><main class="main"><header class="top"><span><b>Рабочее пространство</b>　/　<span id="crumb">Мои подготовки</span></span><span>● Сохранение на устройстве</span></header><div id="app" class="content"></div></main><nav class="mobile"><button data-go="home">⌂　Подготовки</button><button data-go="form">＋　Создать</button></nav><div id="toast" class="toast" role="status"></div><div id="modal"></div>
<script>
(function(){
var KEY='b2b-navigator-v1',types=['Первая встреча','Повторная встреча','Обсуждение предложения','Продление договора','Разбор проблемы','Другое'],sectors=['Производство','Торговля','Финансы','Строительство','Логистика','Здравоохранение','Образование','Государственный сектор','IT','Другое'],roles=['Собственник / руководитель','IT-директор','Технический специалист','Закупки','Финансы','Операционный руководитель','Другое'],dirs=['Интернет для бизнеса','Резервный канал связи','Телефония','Объединение филиалов','Облачные решения','Защита сети','Дата-центр','IoT','Другое'];
var qbase=[['Контекст бизнеса',['Какие направления и процессы сейчас для вас важны?','Как устроена работа команд и площадок?','Что изменилось в компании за последнее время?']],['Текущая инфраструктура и процессы',['Как сейчас организована связь и работа нужных систем?','Какие решения используются и что в них удобно?','Кто отвечает за поддержку этих процессов?']],['Проблемы и последствия',['Есть ли что-то, что хотелось бы улучшить?','В каких ситуациях текущий подход создаёт сложности?','Как это влияет на работу команды?']],['Требования и критерии выбора',['Каким требованиям должно отвечать возможное решение?','По каким критериям оцените варианты?','Какие ограничения важно учесть?']],['Сроки и участники решения',['Есть ли желаемые сроки?','Кого важно подключить к обсуждению?','Как принимается решение по таким вопросам?']],['Следующий шаг',['Какой результат встречи будет полезен?','Как проверить, подходит ли обсуждённый вариант?','Кто подготовит нужные вводные и к какому сроку?']]];
var objection=[['«У нас уже есть поставщик»','Понимаю. Не предлагаю менять работающий процесс без причины.','Что особенно важно сейчас? Есть ли задача, где полезно сравнить подходы?','Точечно проверить требования без обязательств.'],['«Сейчас не планируем менять»','Давайте зафиксируем важные критерии, чтобы вернуться к теме вовремя.','Когда обычно пересматриваете решение?','Согласовать, стоит ли связаться позднее.'],['«Отправьте предложение»','Конечно. Чтобы материалы были полезны, уточню требования.','Какие задачи и критерии отразить? Кто будет читать?','Согласовать вводные и следующий разговор.'],['«Это дорого»','Понимаю, стоимость важна. Сначала уточним критерии сравнения.','С чем сравниваете? Какие критерии главные?','Проверить вводные и официальные условия.'],['«Нужно согласовать»','Конечно, важно подключить участников решения.','Какая информация им нужна? Кого пригласить?','Подготовить резюме и согласовать встречу.'],['«Не видим необходимости»','Не буду предлагать решение без подтверждённой задачи.','Что сейчас работает хорошо? Есть ли планируемые изменения?','Зафиксировать отсутствие актуальной задачи.']];
var dtext={'Интернет для бизнеса':'Может быть полезно, если важно подключение площадки. Уточните требования и проверьте возможность по адресу.','Резервный канал связи':'Стоит обсудить, если важна работа при недоступности основного канала. Уточните сценарии отказа.','Телефония':'Может быть полезна для коммуникаций с клиентами или командами. Уточните сценарии использования.','Объединение филиалов':'Стоит рассмотреть при необходимости доступа к общим ресурсам. Уточните приложения и требования.','Облачные решения':'Могут быть полезны при пересмотре размещения систем. Уточните требования.','Защита сети':'Может быть актуальна при пересмотре доступа и защиты ресурсов.','Дата-центр':'Может быть полезен при обсуждении размещения инфраструктуры. Уточните состав систем.','IoT':'Стоит обсуждать, если есть задача сбора данных с оборудования.'};
var rows=[];try{rows=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}var page='home',active=null,to;
function $(s,r){return (r||document).querySelector(s)}function all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(rows));return true}catch(e){toast('Не удалось сохранить. Проверьте свободное место в браузере.');return false}}
function date(t){return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',year:'numeric'}).format(t)}
function toast(s){var x=$('#toast');x.textContent=s;x.classList.add('show');clearTimeout(to);to=setTimeout(function(){x.classList.remove('show')},2600)}
function go(p){page=p;render();window.scrollTo(0,0)}
function render(){ $('#crumb').textContent=page==='home'?'Мои подготовки':page==='form'?'Новая подготовка':'План переговоров';all('.nav').forEach(function(x){x.classList.toggle('active',x.dataset.go===page||(page==='plan'&&x.dataset.go==='home'))});if(page==='home')home();else if(page==='form')form();else plan()}
function home(){var a=$('#app');a.innerHTML='<div class="head"><div><div class="eyebrow">Рабочее пространство</div><h1>Мои подготовки</h1><p class="sub">Продуманные встречи начинаются с хороших вопросов.</p></div><button class="btn primary" data-go="form">＋ Подготовиться к встрече</button></div><div class="warn"><b>Для демонстрации используйте вымышленные данные.</b> Не вводите конфиденциальную информацию о клиентах.</div><div class="stats"><div class="stat"><small>Всего подготовок</small><strong>'+rows.length+'</strong></div><div class="stat"><small>Обновлено за 7 дней</small><strong>'+rows.filter(function(r){return Date.now()-r.updated<604800000}).length+'</strong></div><div class="stat"><small>Хранение</small><strong style="font-size:13px">Только у вас</strong></div></div><section class="card"><div class="cardhead"><span><b>Недавние подготовки</b><small>Ваши планы и заметки</small></span><span class="filters"><input id="search" placeholder="⌕ Найти подготовку…" aria-label="Поиск"><select id="filter"><option value="">Все встречи</option>'+types.map(function(x){return '<option>'+esc(x)+'</option>'}).join('')+'</select></span></div><div id="rows" class="rows"></div></section><div style="text-align:right;padding-top:10px"><button id="clear" class="btn" style="color:#c55">Удалить все данные</button></div>';
function draw(){var q=$('#search').value.toLowerCase(),f=$('#filter').value,rs=rows.filter(function(r){return (r.title+' '+r.sector).toLowerCase().includes(q)&&(!f||r.type===f)}).sort(function(x,y){return y.updated-x.updated});$('#rows').innerHTML=rs.length?rs.map(function(r){return '<div class="row"><span><b>'+esc(r.title)+(r.demo?' <small>Демо</small>':'')+'</b><small>'+esc(r.sector)+' · '+esc(r.role)+'</small></span><span>'+esc(r.type)+'</span><span><small>Изменено · '+date(r.updated)+'</small></span><span><button class="btn" data-open="'+r.id+'">Открыть →</button> <button class="btn" data-delete="'+r.id+'" aria-label="Удалить">⋯</button></span></div>'}).join(''):'<div class="empty"><h3>'+(rows.length?'Ничего не найдено':'Подготовок пока нет')+'</h3><p>'+(rows.length?'Измените запрос или фильтр.':'Создайте первый план: сформулируйте цель, соберите вопросы и договоритесь о следующих шагах.')+'</p>'+(rows.length?'':'<button class="btn primary" data-go="form">＋ Создать подготовку</button>')+'</div>'}
draw();$('#search').oninput=draw;$('#filter').onchange=draw;$('#clear').onclick=function(){if(!rows.length)return;ask('Удалить все данные?','Подготовки и заметки будут удалены из браузера.','Удалить всё',function(){rows=[];persist();home();toast('Все данные удалены')})}}
function field(n,label,opt){opt=opt||{};var ctl;if(opt.type==='textarea')ctl='<textarea name="'+n+'" placeholder="'+esc(opt.ph)+'">'+esc(opt.val)+'</textarea>';else if(opt.type==='select')ctl='<select name="'+n+'"><option value="">Выберите…</option>'+opt.opts.map(function(x){return '<option '+(x===opt.val?'selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>';else if(opt.type==='checks')ctl='<div class="chips">'+opt.opts.map(function(x){return '<label class="chip"><input type="checkbox" name="dirs" value="'+esc(x)+'" '+((opt.val||[]).includes(x)?'checked':'')+'><span>'+esc(x)+'</span></label>'}).join('')+'</div>';else ctl='<input name="'+n+'" value="'+esc(opt.val)+'" placeholder="'+esc(opt.ph)+'">';return '<div class="field '+(opt.full?'full':'')+'" data-field="'+n+'"><label>'+label+(opt.req?' <i style="color:#c55">*</i>':'')+'</label>'+ctl+'<small class="error">Заполните это поле.</small></div>'}
function form(r){r=r||{};$('#app').innerHTML='<div class="head"><div><div class="eyebrow">'+(r.id?'Редактирование':'Новая встреча')+'</div><h1>'+(r.id?'Данные встречи':'Подготовка к встрече')+'</h1><p class="sub">Добавьте известный контекст, чтобы структурировать разговор.</p></div>'+(r.id?'<button class="btn" id="backplan">← К плану</button>':'')+'</div><div class="warn"><b>Для демонстрации используйте вымышленные данные.</b> Не вводите конфиденциальную информацию о клиентах.</div><form id="form" novalidate><section class="card"><div class="cardhead"><b>Контекст встречи</b><small>Обязательные поля отмечены *</small></div><div class="grid">'+field('title','Название подготовки',{val:r.title,req:true,full:true,ph:'Например, первая встреча — производственная компания'})+field('type','Тип встречи',{type:'select',opts:types,val:r.type,req:true})+field('sector','Отрасль клиента',{type:'select',opts:sectors,val:r.sector,req:true})+field('role','Роль собеседника',{type:'select',opts:roles,val:r.role,req:true})+field('size','Размер компании',{type:'select',opts:['Неизвестно','Малый','Средний','Крупный'],val:r.size||'Неизвестно'})+field('goal','Цель менеджера на встречу',{type:'textarea',val:r.goal,req:true,full:true,ph:'Чего хотите достичь?'})+field('situation','Что известно о ситуации клиента',{type:'textarea',val:r.situation,req:true,full:true,ph:'Запишите только известное; отделяйте факты от предположений.'})+'<div class="subtitle">Дополнительные сведения · необязательно</div>'+field('sites','Количество площадок',{val:r.sites,ph:'Например, 4'})+field('duration','Длительность встречи',{type:'select',opts:['15 минут','30 минут','45 минут','60 минут','90 минут','Другая'],val:r.duration})+field('solutions','Известные действующие решения',{type:'textarea',val:r.solutions,full:true,ph:'Только разрешённый, неконфиденциальный контекст'})+field('problem','Основная проблема или задача',{type:'textarea',val:r.problem,full:true,ph:'Если не подтверждена — укажите явно'})+field('dirs',
